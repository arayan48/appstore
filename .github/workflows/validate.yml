name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check compose files
        run: |
          for f in Apps/*/docker-compose.yml; do
            echo "$f"
            docker compose -f "$f" config -q
          done

      - name: Build store
        uses: IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f # v1.1.3
        with:
          source: .
          output: dist
          base-url: https://arayan48.github.io/appstore
